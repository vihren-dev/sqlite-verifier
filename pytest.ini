[pytest]
testpaths = tests
python_files = test_*.py *_test.py
addopts = --strict-markers --strict-config -ra
markers =
    unit: deterministic unit behavior with explicit isolated inputs
    integration: behavior across repository components or host tools
    e2e: behavior through the public verification or installation entrypoint
    parser: SQL grammar, translation or parser build behavior
    kernel: independent Lean kernel gate and proof acceptance
    approval: protected approved source and schema boundaries
    atuin: Atuin history preservation example
    packaging: native runtime and installer behavior
    conformance: SQLite evidence and coverage completeness
    environment: pinned development environment and resource boundaries
    requires_lean: requires the pinned Lean compiler or checker artifacts
    requires_native: requires native SQLite or parser tools
    requires_nix: requires Nix host services or immutable Nix runtime paths
    smoke: explicitly selected quick toolchain and runtime checks
