# The test-only conformance library and its runner, which compare the model with native SQLite.
# Only the conformance harness and the judge's subject require this package.
name = "verifierConformance"
version = "0.1.0"
defaultTargets = ["conformance-runner"]

[[require]]
name = "belaySqliteModel"
path = "../belay-sqlite-model"

[[lean_lib]]
name = "VerifierConformance"
roots = ["VerifierConformance.Trace", "VerifierConformance.Outputs", "VerifierConformance.PossibleOutputs", "VerifierConformance.Pass", "VerifierConformance.Native", "VerifierConformance.Case", "VerifierConformance.RunPass", "VerifierConformance.RunPassLaws", "VerifierConformance.Classify", "VerifierConformance.RunPassExamples", "VerifierConformance.Json", "VerifierConformance.Predict", "VerifierConformance.QueryOutputs"]

[[lean_exe]]
name = "conformance-runner"
root = "ConformanceRunner"
