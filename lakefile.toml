name = "sqliteVerifier"
version = "0.1.0"
defaultTargets = ["SqliteVerifier"]

# Populated from the pinned, patched source in build-support/lean4export.nix.
[[require]]
name = "lean4export"
path = "build/lean4export"

[[lean_lib]]
name = "SqliteVerifier"

[[lean_lib]]
name = "GateCore"

[[lean_lib]]
name = "StructuralCodec"

[[lean_exe]]
name = "migration-proof-checker"
root = "ProofChecker"

[[lean_exe]]
name = "migration-bundle-checker"
root = "BundleChecker"

[[lean_lib]]
name = "VerifierConformance"
roots = ["VerifierConformance.Trace", "VerifierConformance.Case", "VerifierConformance.Json", "VerifierConformance.Laws"]

[[lean_exe]]
name = "conformance-runner"
root = "ConformanceRunner"
