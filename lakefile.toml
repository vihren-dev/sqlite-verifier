name = "sqliteVerifier"
version = "0.1.0"
defaultTargets = ["SqliteVerifier"]

# Populated from the pinned upstream source in build-support/lean4export.nix.
[[require]]
name = "lean4export"
path = "build/lean4export"

[[require]]
name = "belaySqlite"
path = "packages/belay-sqlite"

[[lean_lib]]
name = "SqliteVerifier"
roots = []
globs = ["SqliteVerifier", "SqliteVerifier.Contract", "SqliteVerifier.ContractProofs", "SqliteVerifier.Library", "SqliteVerifier.NullableProjection", "SqliteVerifier.ApplicationKeys", "SqliteVerifier.ApplicationKeyPreservation"]

# Shipped engineering examples have their own dependency; the production root excludes them.
[[lean_lib]]
name = "EngineeringExamples"
roots = []
globs = ["SqliteVerifier.Examples", "SqliteVerifier.Demonstration", "SqliteVerifier.ReverseDemonstration", "SqliteVerifier.FailureDemonstration", "SqliteVerifier.SchemaExamples", "SqliteVerifier.SqlExamples", "SqliteVerifier.ApplicationKeyDemonstration"]

[[lean_lib]]
name = "GatePaths"

[[lean_lib]]
name = "GateCore"

[[lean_exe]]
name = "migration-proof-checker"
root = "ProofChecker"

[[lean_exe]]
name = "migration-bundle-checker"
root = "BundleChecker"

[[lean_exe]]
name = "migration-proof-exporter"
root = "ProofExporter"

[[lean_lib]]
name = "VerifierConformance"
roots = ["VerifierConformance.Trace", "VerifierConformance.Outputs", "VerifierConformance.Case", "VerifierConformance.Json"]

[[lean_exe]]
name = "conformance-runner"
root = "ConformanceRunner"
