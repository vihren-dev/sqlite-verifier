name: Approved baseline

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  approved-baseline:
    name: Protected approved baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Check out only trusted target-branch code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Read candidate objects without checking out or executing them
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          for key in ('BASE_SHA', 'HEAD_SHA'):
              if re.fullmatch(r'[0-9a-f]{40}', os.environ[key]) is None:
                  raise SystemExit(f'Invalid {key}')
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin',
                          os.environ['HEAD_SHA']], check=True, timeout=60)
          subprocess.run(['python3', 'tests/baseline_ci.py', '--base', os.environ['BASE_SHA'],
                          '--head', os.environ['HEAD_SHA']], check=True, timeout=30)
          PY
