name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  check:
    name: Check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            system: x86_64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select complete checks for the changed inputs
        id: scope
        run: python3 tests/ci_scope.py
      - name: Check documentation and CI routing
        if: steps.scope.outputs.scope == 'docs'
        run: |
          python3 tests/docs_test.py
          python3 -m unittest tests.test_ci_scope
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        if: steps.scope.outputs.scope != 'docs'
        with:
          enable_kvm: false
          set_as_trusted_user: false
      - name: Run checks in one pinned environment
        if: steps.scope.outputs.scope != 'docs'
        env:
          CHECK_SCOPE: ${{ steps.scope.outputs.scope }}
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          python3 tools/check_resources.py
          nix develop path:./nix#capture --command bash -euo pipefail <<'SH'
          test "$SQLITE_VERIFIER_SYSTEM" = "$EXPECTED_SYSTEM"
          just setup
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Variables in the inner script expand only inside the sandbox.
            # shellcheck disable=SC2016
            timeout 15 bwrap \
              --unshare-user --unshare-pid --unshare-net --die-with-parent --new-session \
              --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp \
              --setenv HOST_NETWORK "$(readlink /proc/self/ns/net)" \
              --setenv PROTECTED_WORKSPACE "$GITHUB_WORKSPACE" \
              sh -euc '
                test "$(readlink /proc/self/ns/net)" != "$HOST_NETWORK"
                if touch "$PROTECTED_WORKSPACE/.sandbox-write-probe"; then
                  echo "Workspace unexpectedly writable inside sandbox" >&2
                  exit 1
                fi
                touch /tmp/sandbox-write-probe
              '
          fi
          just "$CHECK_SCOPE"
          SH
      - name: Retain native loader diagnostics
        if: always() && steps.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-loader-${{ matrix.system }}
          path: |
            build/native-dependencies.txt
            build/nix-runtime-roots
          if-no-files-found: warn
          retention-days: 14
      - name: Retain bounded coverage evidence
        if: always() && steps.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.system }}
          path: build/coverage.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain Atuin runner evidence
        if: always() && steps.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atuin-runner-${{ matrix.system }}
          path: |
            build/atuin-capture.json
            build/atuin-runner-receipts.json
            build/atuin-model-payload.json
            build/atuin-model-payload/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain development source snapshot
        if: steps.scope.outputs.scope == 'package'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-source-${{ matrix.system }}
          path: dist/sqlite-verifier-source.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Retain checked native runtime
        if: steps.scope.outputs.scope == 'package'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.system }}
          compression-level: 0
          path: |
            dist/sqlite-verifier-${{ matrix.system }}.tar.gz
            dist/sqlite-verifier-${{ matrix.system }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish checked native archives
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: runtime-*
          path: release-assets
          merge-multiple: true
      - name: Verify asset checksums and create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release-assets && sha256sum --check ./*.sha256)
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${flags[@]}" --verify-tag --title "SQLite verifier $RELEASE_TAG" \
            --notes-file docs/release-notes.md release-assets/*.tar.gz release-assets/*.sha256
