name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # Nightly verifier checks run on both platforms. Pull requests run them on
  # Linux and build the API reference on both platforms.
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}

jobs:
  check:
    name: Check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            system: x86_64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    # The native checks keep their limits; the reference adds a 30-minute phase.
    timeout-minutes: 105
    env:
      BUILD_MODE: build
      # Runtime checks run on Linux for pull requests. The checked reference
      # builds on both native platforms for every non-documentation scope.
      PLATFORM_RUNS: ${{ matrix.system == 'x86_64-linux' || github.event_name != 'pull_request' }}
    steps:
      - name: Skip macOS runtime checks on pull requests
        if: env.PLATFORM_RUNS != 'true'
        run: echo "macOS runtime checks run on main, tags, manual and nightly runs; the API reference builds on both platforms."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select complete checks for the changed inputs
        id: scope
        run: python3 tests/ci_scope.py
      - name: Check documentation and CI routing
        if: env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope == 'docs'
        run: |
          python3 tests/docs_test.py
          python3 -m unittest tests.test_ci_scope
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        if: steps.scope.outputs.scope != 'docs'
        with:
          enable_kvm: false
          set_as_trusted_user: false
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false
            keep-outputs = true
            keep-derivations = true
      - name: Restore Nix builds and test results
        if: steps.scope.outputs.scope != 'docs'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        env:
          # Failed Nix builds can leave unreadable transient locks; never archive them.
          TAR_OPTIONS: --no-wildcards-match-slash --exclude=nix/store/*.lock
        with:
          # The key covers every file except task records, so a push that changes only
          # plans/ or reviews/ restores the exact store of the previous push and saves nothing.
          primary-key: nix-tests-v2-${{ matrix.system }}-${{ hashFiles('nix/*.nix', 'nix/flake.lock') }}-${{ hashFiles('**', '!.git/**', '!plans/**', '!reviews/**') }}
          restore-prefixes-first-match: |
            nix-tests-v2-${{ matrix.system }}-${{ hashFiles('nix/*.nix', 'nix/flake.lock') }}-
            nix-tests-v1-${{ matrix.system }}-${{ hashFiles('nix/*.nix', 'nix/flake.lock') }}-
          # Pull requests save too; a pull request's cache is visible only to its own later runs.
          save: true
      - name: Build checked API reference
        if: steps.scope.outputs.scope != 'docs'
        env:
          REFERENCE_REVISION: ${{ github.sha }}
        run: nix develop path:./nix --command just reference "$REFERENCE_REVISION"
      - name: Run checks in one pinned environment
        if: env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope != 'docs'
        env:
          CHECK_SCOPE: ${{ steps.scope.outputs.scope }}
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          python3 tools/check_resources.py
          nix develop path:./nix --command python3 tools/ci_checks.py \
            --system "$EXPECTED_SYSTEM" --scope "$CHECK_SCOPE" --mode "$BUILD_MODE"
      - name: Retain checked API reference
        if: always() && steps.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-reference-${{ matrix.system }}
          path: build/api-reference/
          if-no-files-found: error
          retention-days: 14
      - name: Keep only the store paths that this commit needs
        if: always() && env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope != 'docs'
        # A failure only leaves the saved cache larger; it never changes a check result.
        continue-on-error: true
        run: nix develop path:./nix --command python3 tools/ci_store_gc.py
      - name: Retain pytest reports and Nix test outputs
        if: always() && env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: case-reports-${{ matrix.system }}
          path: |
            build/test-results/
            build/nix-tests*/
            build/ci-phases.json
            build/ci-phases/
            build/ci-environment.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain proof runtime closure
        if: always() && env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-closure-${{ matrix.system }}
          path: |
            build/nix-runtime-roots
          if-no-files-found: warn
          retention-days: 14
      - name: Retain development source snapshot
        if: env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope == 'package'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-source-${{ matrix.system }}
          path: dist/sqlite-verifier-source.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Retain checked native runtime
        if: env.PLATFORM_RUNS == 'true' && (steps.scope.outputs.scope == 'package' || steps.scope.outputs.scope == 'packaging')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.system }}
          compression-level: 0
          path: |
            dist/sqlite-verifier-${{ matrix.system }}.tar.gz
            dist/sqlite-verifier-${{ matrix.system }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish checked native archives
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: runtime-*
          path: release-assets
          merge-multiple: true
      - name: Verify asset checksums and create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release-assets && sha256sum --check ./*.sha256)
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${flags[@]}" --verify-tag --title "SQLite verifier $RELEASE_TAG" \
            --notes-file docs/release-notes.md release-assets/*.tar.gz release-assets/*.sha256
