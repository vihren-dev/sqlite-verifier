name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  check:
    name: Check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            system: x86_64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'attic-publish' || 'attic-read' }}
    timeout-minutes: 30
    env:
      BUILD_MODE: build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select complete checks for the changed inputs
        id: scope
        run: python3 tests/ci_scope.py
      - name: Check documentation and CI routing
        if: steps.scope.outputs.scope == 'docs'
        run: |
          python3 tests/docs_test.py
          python3 -m unittest tests.test_ci_scope
      - name: Prepare private cache authentication
        if: steps.scope.outputs.scope != 'docs'
        env:
          ATTIC_READ_TOKEN: ${{ secrets.ATTIC_READ_TOKEN }}
        run: |
          umask 077
          touch "$RUNNER_TEMP/attic.netrc"
          if [[ -n "$ATTIC_READ_TOKEN" ]]; then
            printf 'machine cache.vihren.dev login token password %s\n' "$ATTIC_READ_TOKEN" > "$RUNNER_TEMP/attic.netrc"
          fi
          sudo mkdir -p /etc/nix
          sudo install -m 600 "$RUNNER_TEMP/attic.netrc" /etc/nix/attic.netrc
          rm "$RUNNER_TEMP/attic.netrc"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        if: steps.scope.outputs.scope != 'docs'
        with:
          enable_kvm: false
          set_as_trusted_user: false
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false
            extra-substituters = ${{ secrets.ATTIC_READ_TOKEN != '' && 'https://cache.vihren.dev/sqlite-verifier' || '' }}
            extra-trusted-public-keys = sqlite-verifier:tbKquH1YWJZFbMzT6Z14DmJ5yeVMnHSYobIDGdkWGis=
            netrc-file = /etc/nix/attic.netrc
      - name: Run checks in one pinned environment
        if: steps.scope.outputs.scope != 'docs'
        env:
          CHECK_SCOPE: ${{ steps.scope.outputs.scope }}
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          python3 tools/check_resources.py
          nix develop path:./nix --command python3 tools/ci_checks.py \
            --system "$EXPECTED_SYSTEM" --scope "$CHECK_SCOPE" --mode "$BUILD_MODE"
      - name: Publish successful Nix builds and test results
        if: success() && steps.scope.outputs.scope != 'docs' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        timeout-minutes: 10
        env:
          ATTIC_WRITE_TOKEN: ${{ secrets.ATTIC_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          : "${ATTIC_WRITE_TOKEN:?Missing attic-publish environment secret}"
          attic=$(nix-build --expr '(import ./build-support/locked-nixpkgs.nix {}).attic-client' --no-out-link)
          export XDG_CONFIG_HOME="$RUNNER_TEMP/attic-client"
          umask 077
          "$attic/bin/attic" login vihren https://cache.vihren.dev "$ATTIC_WRITE_TOKEN"
          nix build path:./nix#sqlite path:./nix#sqlite346 --no-link --print-out-paths > "$RUNNER_TEMP/attic-paths"
          printf '%s\n' build/runtime build/nix-tests* >> "$RUNNER_TEMP/attic-paths"
          "$attic/bin/attic" push vihren:sqlite-verifier --stdin < "$RUNNER_TEMP/attic-paths"
      - name: Remove cache credentials
        if: always() && steps.scope.outputs.scope != 'docs'
        run: |
          sudo rm -f /etc/nix/attic.netrc
          rm -rf "$RUNNER_TEMP/attic-client"
      - name: Retain pytest reports and Nix test outputs
        if: always() && steps.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: case-reports-${{ matrix.system }}
          path: |
            build/test-results/
            build/nix-tests*/
            build/ci-phases.json
            build/ci-phases/
            build/ci-environment.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain proof runtime closure
        if: always() && steps.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-closure-${{ matrix.system }}
          path: |
            build/nix-runtime-roots
          if-no-files-found: warn
          retention-days: 14
      - name: Retain development source snapshot
        if: steps.scope.outputs.scope == 'package'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-source-${{ matrix.system }}
          path: dist/sqlite-verifier-source.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Retain checked native runtime
        if: steps.scope.outputs.scope == 'package'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.system }}
          compression-level: 0
          path: |
            dist/sqlite-verifier-${{ matrix.system }}.tar.gz
            dist/sqlite-verifier-${{ matrix.system }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish checked native archives
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: runtime-*
          path: release-assets
          merge-multiple: true
      - name: Verify asset checksums and create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release-assets && sha256sum --check ./*.sha256)
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${flags[@]}" --verify-tag --title "SQLite verifier $RELEASE_TAG" \
            --notes-file docs/release-notes.md release-assets/*.tar.gz release-assets/*.sha256
