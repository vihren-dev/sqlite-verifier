name: ADR 0001 native benchmark
on:
  workflow_dispatch:
    inputs:
      pilot:
        description: Validate evidence plumbing with four native jobs; never qualifies for rollout
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: adr1-benchmark
  cancel-in-progress: false
jobs:
  repetition:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      # Complete each group's restores before another group competes for the 10 GB cache.
      max-parallel: 1
      matrix:
        replica: ${{ fromJSON(inputs.pilot && '[1]' || '[1, 2, 3]') }}
    uses: ./.github/workflows/benchmark-repetition.yml
    with:
      replica: ${{ matrix.replica }}
      pilot: ${{ inputs.pilot }}
  summarize:
    if: always() && github.ref == 'refs/heads/main'
    needs: repetition
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: adr1-benchmark-*
          path: evidence
      - name: Compare completed jobs including cache post-save overhead
        # Pilot intentionally cannot satisfy the unchanged sixty-sample rollout gate.
        continue-on-error: ${{ inputs.pilot }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/benchmark_summary.py evidence benchmark-summary
      - name: Retain all raw job timing and transfer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adr1-benchmark-summary
          path: benchmark-summary/
          if-no-files-found: warn
          retention-days: 30
